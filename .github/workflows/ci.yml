name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  quality:
    name: Lint, typecheck, unit, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run db:generate
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:unit
      - run: npm run test:component
      - run: npm run build
        env:
          DATABASE_URL: postgresql://urusin_app:ci@127.0.0.1:5433/urusin?schema=public
          NEXTAUTH_URL: http://127.0.0.1:3000
          NEXTAUTH_SECRET: ci-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          EMAIL_TRANSPORT: mailpit
          EMAIL_SERVER_HOST: 127.0.0.1
          EMAIL_SERVER_PORT: 1025
          EMAIL_FROM: URUSIN CI <no-reply@urusin.test>
          OFFICIAL_DOMAIN_ALLOWLIST: example.com

  integration:
    name: Integration (PostgreSQL)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: urusin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d urusin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/urusin_test?schema=public
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/urusin_test?schema=public
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/urusin_test?schema=public
      TEST_MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/urusin_test?schema=public
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ci-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      EMAIL_TRANSPORT: mailpit
      EMAIL_SERVER_HOST: 127.0.0.1
      EMAIL_SERVER_PORT: 1025
      EMAIL_FROM: URUSIN CI <no-reply@urusin.test>
      OFFICIAL_DOMAIN_ALLOWLIST: example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration

  e2e:
    name: E2E (Playwright + Mailpit)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18.6-alpine@sha256:9ba53c7d41ea093baf5c1ba635ba5434c4f979880527d49bb7d9237d3193085b
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: urusin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d urusin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.34.0@sha256:23a2ef85bc50853ab3093645d1d64679afd8887e89da5e48a88940c172591a4e
        ports:
          - 1025:1025
          - 8025:8025
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/urusin_test?schema=public
      MIGRATE_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/urusin_test?schema=public
      NEXTAUTH_URL: http://127.0.0.1:3000
      NEXTAUTH_SECRET: ci-secret-aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
      EMAIL_TRANSPORT: mailpit
      EMAIL_SERVER_HOST: 127.0.0.1
      EMAIL_SERVER_PORT: 1025
      EMAIL_FROM: URUSIN CI <no-reply@urusin.test>
      OFFICIAL_DOMAIN_ALLOWLIST: example.com
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm run db:generate
      - run: npx prisma migrate deploy
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --include=dev
      - run: npm ls @auth/core
      - run: npm ls nodemailer
      - run: npm audit --audit-level=high
